# GHCR tag is the competition year (branch eurobot-YYYY → image :YYYY). Override with env EUROBOT_IMAGE_TAG.
services:
  eurobot-2026-web:
    image: ghcr.io/dit-robotics/eurobot-web:${EUROBOT_IMAGE_TAG:-2026}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eurobot-2026-web
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - /home/share/data:/home/share/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    network_mode: "host"
