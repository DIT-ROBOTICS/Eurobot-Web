<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="/js/model-viewer.min.js"></script>
  <style>
    @font-face {
      font-family: 'MStiffHeiHK';
      src: url('/fonts/mstiffhei-hk-ultrabold.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #141414;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: #141414;
      --progress-bar-color: var(--progress-accent, #de272c);
      --progress-bar-height: 8px;
      --progress-mask: #141414;
      --camera-orbit-sensitivity: 0.85;
      /* Hand / gesture ring: also need interaction-prompt="none" on the element */
      --interaction-prompt-threshold: 0;
      --interaction-prompt: none;
      --interaction-prompt-display: none;
    }
    model-viewer::part(default-progress-bar) { height: 8px; background-color: #444444; }
    model-viewer::part(default-ar-button) { display: none; }
    model-viewer::part(control-button) {
      background-color: #2a2a2a;
      min-height: 52px;
      min-width: 52px;
    }
    model-viewer::part(default-icon-button) { background-color: rgba(32, 32, 32, 0.92); }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background-color: #141414;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 77, 77, 0.3);
      border-top: 4px solid var(--progress-accent, #de272c);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .model-nav {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 100;
      display: flex;
      gap: 12px;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 8px;
    }
    .nav-arrow {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 8px;
      background-color: #333;
      border: 2px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-arrow:hover { background-color: #404040; }
    .nav-arrow svg { width: 26px; height: 26px; fill: #e0e0e0; }
  </style>
</head>
<body>
  <div class="model-nav">
    <div class="nav-arrow" id="prev-model" title="Previous stored model" role="button" tabindex="0" aria-label="Previous model">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </div>
    <div class="nav-arrow" id="next-model" title="Next stored model" role="button" tabindex="0" aria-label="Next model">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </div>
  </div>
  <model-viewer
    id="robot-model"
    alt="Robot 3D Model"
    interaction-prompt="none"
    camera-controls
    shadow-intensity="0.4"
    camera-orbit="0deg 55deg 1.1m"
    min-camera-orbit="auto 0deg 0.85m"
    max-camera-orbit="auto 180deg 1.7m"
    camera-target="0m 0.2m 0m"
    field-of-view="28deg"
    environment-image="neutral"
  >
    <div slot="poster" class="loading-container" aria-hidden="true">
      <div class="loading-spinner" id="spinner" style="display:none"></div>
    </div>
  </model-viewer>
  <script src="/js/cinematic-camera-orbit.js"></script>
  <script>
    (function () {
      const modelViewer = document.getElementById('robot-model');
      const prevBtn = document.getElementById('prev-model');
      const nextBtn = document.getElementById('next-model');
      function applySrc(url) {
        if (url) {
          modelViewer.src = url;
          const sp = document.getElementById('spinner');
          if (sp) sp.style.display = 'block';
        } else {
          modelViewer.removeAttribute('src');
        }
      }
      window.addEventListener('message', function (e) {
        if (!e.data) return;
        if (e.data.type === 'eurobot-set-model') {
          applySrc(e.data.src || null);
        }
        if (e.data.type === 'eurobot-theme' && e.data.accent) {
          document.documentElement.style.setProperty('--progress-accent', e.data.accent);
        }
      });
      function go(delta) {
        try {
          window.parent.postMessage({ type: 'eurobot-glb-nav', delta: delta }, '*');
        } catch (err) {}
      }
      prevBtn.addEventListener('click', function () { go(-1); });
      nextBtn.addEventListener('click', function () { go(1); });
    })();
  </script>
</body>
</html>
